{% extends 'base.html' %}
{% load static %}

{% block title %}Restaurant Portal Login | DineFlow{% endblock %}

{% block navbar %}
<nav class="navbar py-3" style="background-color: var(--color-burgundy); border-bottom: 2px solid var(--color-coral);">
  <div class="container justify-content-center">
    <a class="navbar-brand d-flex align-items-center gap-2 text-white fw-bold fs-4" href="{% url 'platform_home' %}">
      <i class="bi bi-qr-code-scan text-warning"></i>
      <span>Dine<span style="color: var(--color-coral);">Flow</span></span>
    </a>
  </div>
</nav>
{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 460px;">
  <div class="p-4 p-md-5 rounded-4 shadow-lg bg-white border" style="border-color: var(--color-border) !important;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-2" style="background: var(--color-soft-peach); color: var(--color-terracotta); width: 64px; height: 64px;">
        <i class="bi bi-shield-lock-fill fs-2"></i>
      </div>
      <h3 class="fw-extrabold mb-1" style="color: var(--color-burgundy);">Restaurant Portal</h3>
      <p class="text-muted small">Log in to manage orders, live menus, and QR tables.</p>
    </div>

    <form method="POST" action="">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold small text-muted text-uppercase">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
          <input type="text" name="username" class="form-control rounded-end-3" placeholder="owner username" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold small text-muted text-uppercase">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" name="password" class="form-control rounded-end-3" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-coral w-100 py-2 fs-6 mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
      </button>

      <div class="text-center">
        <a href="{% url 'platform_home' %}" class="small text-muted text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i> Return to Homepage
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
